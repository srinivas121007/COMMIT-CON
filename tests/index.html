<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Repair Tool - Test Suite Runner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --border: #1f2937;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.2);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.2);
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.2);
      --mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      line-height: 1.5;
      padding: 32px 20px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .title-group h1 {
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-tag {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(59, 130, 246, 0.3);
      font-weight: 600;
    }

    .title-group p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 4px;
    }

    button#run-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    button#run-btn:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }

    button#run-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stat-val {
      font-size: 1.75rem;
      font-weight: 700;
      margin-top: 4px;
      font-family: var(--mono);
    }

    .stat-val.passed { color: var(--success); }
    .stat-val.failed { color: var(--danger); }

    .test-log-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .card-header {
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.875rem;
      font-weight: 600;
    }

    .test-items {
      list-style: none;
      font-family: var(--mono);
      font-size: 0.8125rem;
    }

    .test-item {
      padding: 10px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .test-item:last-child {
      border-bottom: none;
    }

    .status-pill {
      font-size: 0.6875rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .status-pill.pass {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-pill.fail {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .test-info {
      flex: 1;
    }

    .test-desc {
      color: var(--text);
    }

    .test-suite-header {
      background: rgba(59, 130, 246, 0.05);
      padding: 8px 18px;
      font-weight: 600;
      color: #93c5fd;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .test-err {
      color: var(--danger);
      margin-top: 4px;
      font-size: 0.75rem;
    }

    .metrics-banner {
      margin-top: 20px;
      background: rgba(16, 185, 129, 0.05);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      font-size: 0.875rem;
    }

    .metric-item {
      display: flex;
      flex-direction: column;
    }

    .metric-item span:first-child {
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .metric-item span:last-child {
      color: var(--text);
      font-weight: 600;
      font-family: var(--mono);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-group">
        <h1>
          Pipeline Test Runner
          <span class="badge-tag">Stage 2</span>
        </h1>
        <p>In-browser verification suite for data quality, entity resolution, and knowledge repair algorithms</p>
      </div>
      <button id="run-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        Run Test Suite
      </button>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Tests</div>
        <div class="stat-val" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Passed</div>
        <div class="stat-val passed" id="stat-passed">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Failed</div>
        <div class="stat-val failed" id="stat-failed">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Execution Time</div>
        <div class="stat-val" id="stat-time">0ms</div>
      </div>
    </div>

    <div class="test-log-card">
      <div class="card-header">
        <span>Execution Log</span>
        <span id="log-status" style="color: var(--text-muted); font-size: 0.75rem;">Idle</span>
      </div>
      <ul class="test-items" id="test-list">
        <!-- Dynamically injected test items -->
      </ul>
    </div>

    <div class="metrics-banner" id="benchmark-banner" style="display: none;">
      <div class="metric-item">
        <span>Pipeline Execution</span>
        <span id="bench-time">-</span>
      </div>
      <div class="metric-item">
        <span>Quality Before</span>
        <span id="bench-before">-</span>
      </div>
      <div class="metric-item">
        <span>Quality After</span>
        <span id="bench-after" style="color: var(--success);">-</span>
      </div>
      <div class="metric-item">
        <span>Precision</span>
        <span id="bench-prec">-</span>
      </div>
      <div class="metric-item">
        <span>Recall</span>
        <span id="bench-rec">-</span>
      </div>
      <div class="metric-item">
        <span>F1-Score</span>
        <span id="bench-f1">-</span>
      </div>
    </div>
  </div>

  <script type="module">
    import { createDatasetPackage } from '../data/generateDataset.js';
    import { profileDataset } from '../public/js/pipeline/profiler.js';
    import { normalizeDataset, titleCaseName, normalizeIsoDate, standardizePlaceName } from '../public/js/pipeline/normalizer.js';
    import { levenshteinDistance, levenshteinSimilarity, jaroWinklerSimilarity, computeNameSimilarity, detectDuplicates } from '../public/js/pipeline/duplicates.js';
    import { detectContradictions } from '../public/js/pipeline/contradictions.js';
    import { repairDataset } from '../public/js/pipeline/repair.js';
    import { calculateQualityScore, evaluateBenchmark } from '../public/js/pipeline/scoring.js';
    import { createChangeLogEntry, revertChangeOnRecord, reapplyChangeOnRecord, getRecordProvenance } from '../public/js/pipeline/audit.js';
    import { executePipeline } from '../public/js/pipeline/worker.js';

    const testList = document.getElementById('test-list');
    const runBtn = document.getElementById('run-btn');
    const statTotal = document.getElementById('stat-total');
    const statPassed = document.getElementById('stat-passed');
    const statFailed = document.getElementById('stat-failed');
    const statTime = document.getElementById('stat-time');
    const logStatus = document.getElementById('log-status');
    const benchBanner = document.getElementById('benchmark-banner');

    function appendSuiteHeader(title) {
      const li = document.createElement('li');
      li.className = 'test-suite-header';
      li.textContent = title;
      testList.appendChild(li);
    }

    function appendTestResult(desc, passed, error = null) {
      const li = document.createElement('li');
      li.className = 'test-item';
      li.innerHTML = `
        <span class="status-pill ${passed ? 'pass' : 'fail'}">${passed ? 'PASS' : 'FAIL'}</span>
        <div class="test-info">
          <div class="test-desc">${desc}</div>
          ${error ? `<div class="test-err">${error}</div>` : ''}
        </div>
      `;
      testList.appendChild(li);
    }

    async function runAllTests() {
      runBtn.disabled = true;
      testList.innerHTML = '';
      benchBanner.style.display = 'none';
      logStatus.textContent = 'Running tests...';

      let total = 0;
      let passed = 0;
      let failed = 0;
      const t0 = performance.now();

      function assert(condition, message) {
        if (!condition) throw new Error(message || 'Assertion failed');
      }
      function assertEqual(actual, expected, message) {
        if (actual !== expected) throw new Error(message || `Expected ${expected}, got ${actual}`);
      }

      function execSyncTest(suite, desc, fn) {
        total++;
        try {
          fn();
          passed++;
          appendTestResult(desc, true);
        } catch (e) {
          failed++;
          appendTestResult(desc, false, e.message);
        }
      }

      // 1. Normalization
      appendSuiteHeader('Suite 1: Data Normalization Rules');
      execSyncTest('Norm', 'titleCaseName converts uppercase to Title Case', () => {
        assertEqual(titleCaseName('ALAN TURING'), 'Alan Turing');
        assertEqual(titleCaseName('grace hopper'), 'Grace Hopper');
      });
      execSyncTest('Norm', 'titleCaseName preserves initials and particles', () => {
        assertEqual(titleCaseName('J. R. TOLKIEN'), 'J. R. Tolkien');
        assertEqual(titleCaseName('JOHN VON NEUMANN'), 'John von Neumann');
      });
      execSyncTest('Norm', 'normalizeIsoDate handles YYYY/MM/DD and DD-MM-YYYY', () => {
        assertEqual(normalizeIsoDate('1982/04/15'), '1982-04-15');
        assertEqual(normalizeIsoDate('15-04-1982'), '1982-04-15');
      });
      execSyncTest('Norm', 'standardizePlaceName resolves common aliases', () => {
        assertEqual(standardizePlaceName('NYC'), 'New York');
        assertEqual(standardizePlaceName('Lon, UK'), 'London');
        assertEqual(standardizePlaceName('Wien'), 'Vienna');
      });
      execSyncTest('Norm', 'normalizeDataset trims, fixes casing, dates, and logs changes', () => {
        const sample = [{ id: 'p1', type: 'person', attributes: { name: '   ada lovelace   ', birth_date: '1815/12/10', birth_place: 'Lon, UK' } }];
        const res = normalizeDataset(sample);
        assertEqual(res.normalizedRecords[0].attributes.name, 'Ada Lovelace');
        assert(res.changes.length >= 3);
      });

      // 2. Duplicate Detection
      appendSuiteHeader('Suite 2: Duplicate Detection & String Similarity');
      execSyncTest('Dup', 'Levenshtein distance & normalized similarity', () => {
        assertEqual(levenshteinDistance('Smith', 'Smyth'), 1);
        assert(levenshteinSimilarity('Smith', 'Smyth') >= 0.80);
      });
      execSyncTest('Dup', 'Jaro-Winkler gives high similarity for prefixes and transpositions', () => {
        assert(jaroWinklerSimilarity('Oppenheimer', 'Openheimer') > 0.90);
      });
      execSyncTest('Dup', 'computeNameSimilarity handles nicknames and initials', () => {
        assert(computeNameSimilarity('Robert Oppenheimer', 'Bob Oppenheimer').score >= 0.85);
        assert(computeNameSimilarity('Alan Turing', 'A. Turing').score >= 0.85);
      });
      execSyncTest('Dup', 'detectDuplicates classifies pairs and forms auto-merge clusters', () => {
        const records = [
          { id: 'o1', type: 'person', attributes: { name: 'John Smith', birth_date: '1900-01-01', birth_place: 'London' } },
          { id: 'o1_dup', type: 'person', attributes: { name: 'Jon Smyth', birth_date: '1900-01-01', birth_place: 'London' } }
        ];
        const res = detectDuplicates(records);
        assertEqual(res.duplicatePairs.length, 1);
        assertEqual(res.autoMergeGroups.length, 1);
      });

      // 3. Contradictions
      appendSuiteHeader('Suite 3: Contradiction & Logic Anomaly Detection');
      execSyncTest('Contra', 'detectContradictions flags DEATH_BEFORE_BIRTH', () => {
        const res = detectContradictions([{ id: 'p1', type: 'person', attributes: { birth_date: '1950-01-01', death_date: '1930-01-01' } }]);
        assert(res.contradictions.some(c => c.rule === 'DEATH_BEFORE_BIRTH'));
      });
      execSyncTest('Contra', 'detectContradictions flags IMPOSSIBLE_AGE (> 125 years)', () => {
        const res = detectContradictions([{ id: 'p1', type: 'person', attributes: { birth_date: '1800-01-01', death_date: '1985-01-01' } }]);
        assert(res.contradictions.some(c => c.rule === 'IMPOSSIBLE_AGE'));
      });
      execSyncTest('Contra', 'detectContradictions flags CIRCULAR_PARENTAGE graph cycle', () => {
        const res = detectContradictions([
          { id: 'pA', type: 'person', relationships: [{ type: 'parent_of', targetId: 'pB' }] },
          { id: 'pB', type: 'person', relationships: [{ type: 'parent_of', targetId: 'pA' }] }
        ]);
        assert(res.contradictions.some(c => c.rule === 'CIRCULAR_PARENTAGE'));
      });
      execSyncTest('Contra', 'detectContradictions flags SPATIOTEMPORAL_COLLISION', () => {
        const res = detectContradictions([
          { id: 'pT', type: 'person', relationships: [{ type: 'attended', targetId: 'e1' }, { type: 'attended', targetId: 'e2' }] },
          { id: 'e1', type: 'event', attributes: { date: '1927-10-24', location: 'London' } },
          { id: 'e2', type: 'event', attributes: { date: '1927-10-24', location: 'Tokyo' } }
        ]);
        assert(res.contradictions.some(c => c.rule === 'SPATIOTEMPORAL_COLLISION'));
      });

      // 4. Repair Engine
      appendSuiteHeader('Suite 4: Canonical Repair & Imputation Engine');
      execSyncTest('Repair', 'repairDataset merges duplicates and imputes missing fields', () => {
        const records = [
          { id: 'p1', type: 'person', attributes: { name: 'John Smith', birth_date: '1900-01-01', occupation: null } },
          { id: 'p1_dup', type: 'person', attributes: { name: 'Jon Smyth', birth_date: '1900-01-01', occupation: 'Mathematician' } }
        ];
        const res = repairDataset({ records, autoMergeGroups: [records], contradictions: [] });
        assertEqual(res.repairedRecords.length, 1);
        assertEqual(res.repairedRecords[0].attributes.occupation, 'Mathematician');
      });
      execSyncTest('Repair', 'repairDataset breaks circular lineage and clears invalid death dates', () => {
        const records = [
          { id: 'pA', type: 'person', attributes: { birth_date: '1950-01-01', death_date: '1930-01-01' }, relationships: [{ type: 'parent_of', targetId: 'pB' }] },
          { id: 'pB', type: 'person', attributes: { birth_date: '1975-01-01' }, relationships: [{ type: 'parent_of', targetId: 'pA' }] }
        ];
        const contra = [
          { rule: 'DEATH_BEFORE_BIRTH', recordId: 'pA' },
          { rule: 'CIRCULAR_PARENTAGE', recordId: 'pB', relatedRecordId: 'pA' }
        ];
        const res = repairDataset({ records, autoMergeGroups: [], contradictions: contra });
        assertEqual(res.repairedRecords.find(r => r.id === 'pA').attributes.death_date, null);
      });

      // 5. Scoring & Audit
      appendSuiteHeader('Suite 5: Quality Scoring & 1-Click Field Reversion');
      execSyncTest('Score', 'calculateQualityScore accurately computes dimensions', () => {
        const score = calculateQualityScore([{ id: 'p1', type: 'person', attributes: { name: 'Ada', birth_date: '1815-12-10', birth_place: 'London', occupation: 'Math' } }]);
        assertEqual(score.overall, 1.0);
      });
      execSyncTest('Audit', 'revertChangeOnRecord rolls back field to oldValue and updates status', () => {
        const rec = { attributes: { name: 'Alan Turing' } };
        const change = createChangeLogEntry({ recordId: 'p1', targetField: 'attributes.name', oldValue: 'ALAN TURING', newValue: 'Alan Turing', rule: 'NORMALIZE_CASE' });
        revertChangeOnRecord(rec, change);
        assertEqual(rec.attributes.name, 'ALAN TURING');
        assertEqual(change.status, 'reverted');
        reapplyChangeOnRecord(rec, change);
        assertEqual(rec.attributes.name, 'Alan Turing');
        assertEqual(change.status, 'applied');
      });

      // 6. End-to-End
      appendSuiteHeader('Suite 6: End-to-End Pipeline & Performance');
      total++;
      try {
        const pkg = createDatasetPackage(42);
        const pipeStart = performance.now();
        const pipeRes = await executePipeline(pkg.corrupted);
        const pipeDuration = Math.round(performance.now() - pipeStart);

        assert(pipeDuration < 1000, `Execution time (${pipeDuration}ms) exceeded 1000ms`);
        assert(pipeRes.benchmark.precision >= 0.90, `Precision was ${pipeRes.benchmark.precision}`);
        assert(pipeRes.benchmark.recall >= 0.85, `Recall was ${pipeRes.benchmark.recall}`);

        passed++;
        appendTestResult(`executePipeline completed in ${pipeDuration}ms (Precision: ${(pipeRes.benchmark.precision*100).toFixed(1)}%, Recall: ${(pipeRes.benchmark.recall*100).toFixed(1)}%)`, true);

        // Update benchmark banner
        benchBanner.style.display = 'flex';
        document.getElementById('bench-time').textContent = `${pipeDuration}ms`;
        document.getElementById('bench-before').textContent = `${pipeRes.qualityBefore.percentages.overall}%`;
        document.getElementById('bench-after').textContent = `${pipeRes.qualityAfter.percentages.overall}%`;
        document.getElementById('bench-prec').textContent = `${(pipeRes.benchmark.precision * 100).toFixed(1)}%`;
        document.getElementById('bench-rec').textContent = `${(pipeRes.benchmark.recall * 100).toFixed(1)}%`;
        document.getElementById('bench-f1').textContent = `${(pipeRes.benchmark.f1 * 100).toFixed(1)}%`;

      } catch (err) {
        failed++;
        appendTestResult('executePipeline end-to-end execution failed', false, err.message);
      }

      const totalTime = Math.round(performance.now() - t0);
      statTotal.textContent = total;
      statPassed.textContent = passed;
      statFailed.textContent = failed;
      statTime.textContent = `${totalTime}ms`;
      logStatus.textContent = failed === 0 ? 'All tests passed successfully!' : `${failed} test(s) failed`;
      logStatus.style.color = failed === 0 ? 'var(--success)' : 'var(--danger)';
      runBtn.disabled = false;
    }

    runBtn.addEventListener('click', runAllTests);

    // Auto-run on load
    runAllTests();
  </script>
</body>
</html>
